name: ci

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "*.md"
      - "skills-man-cli/**"
  pull_request:
    paths-ignore:
      - "*.md"
      - "skills-man-cli/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.os }}-cargo

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy -- -D warnings

  prepare-release:
    if: github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.resolve.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve tag from Cargo.toml
        id: resolve
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "skills-man") | .version')
          tag="v$version"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists. Bump the version in Cargo.toml first."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from ${{ github.sha }}"

  build-release:
    needs: [check, prepare-release]

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        include:
          - os: ubuntu-latest
            targets: "x86_64-unknown-linux-musl,aarch64-unknown-linux-musl"

          - os: macos-15
            targets: "x86_64-apple-darwin,aarch64-apple-darwin"

          - os: windows-latest
            targets: "x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.os }}-cargo

      - name: Install zig
        uses: korandoru/setup-zig@v1
        if: matrix.os == 'ubuntu-latest'
        with:
          zig-version: 0.11.0

      - name: Install binstall
        uses: cargo-bins/cargo-binstall@main
        if: matrix.os == 'ubuntu-latest'

      - name: Install zigbuild
        run: |
          cargo binstall -y --force cargo-zigbuild
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        if: matrix.os == 'ubuntu-latest'

      - name: Build
        shell: pwsh
        run: |
          ("${{ matrix.targets }}" -split ",") | ForEach-Object {
            Write-Host "Building $_"

            if ("${{ matrix.os }}" -ne "ubuntu-latest") {
              cargo build --verbose --release --target $_
            } else {
              cargo zigbuild --verbose --release --target $_
            }
          }

      - name: Archive artifacts
        shell: pwsh
        run: |
          $isWin = "${{ matrix.os }}".StartsWith("windows-")
          $ext = $isWin ? ".exe" : ""

          ("${{ matrix.targets }}" -split ",") | ForEach-Object {
            $binaryName = "skill$ext"
            $targetBinaryName = "skill-$_$ext"
            Move-Item -Path (Join-Path . target $_ release $binaryName) -Destination (Join-Path . $targetBinaryName)

            if ($isWin) {
              Compress-Archive -Path (Join-Path . $targetBinaryName) -DestinationPath ".\skill-$_.zip"
            } else {
              tar -czf "./skill-$_.tar.gz" $targetBinaryName
            }

            Remove-Item (Join-Path . $targetBinaryName)
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            skill-*.tar.gz
            skill-*.zip
          if-no-files-found: error

  release:
    needs: [prepare-release, build-release]

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: List artifacts
        run: ls -l dist

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
